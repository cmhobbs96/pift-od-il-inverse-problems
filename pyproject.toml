[project]
name = "pift-od-il-inverse-problems"
version = "0.1.0"
description = "Physics-informed information field theory experiments with JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jax>=0.4.28",
  "jaxlib>=0.4.28",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "PySide6>=6.7",
  "pytest>=8.0",
  "pyyaml>=6.0",
  "numpyro>=0.15",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.4.28"]
gpu-metal = ["jax-metal"]
modal = ["modal>=0.64"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
