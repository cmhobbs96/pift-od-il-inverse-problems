[project]
name = "pift-od-il-inverse-problems"
version = "0.1.0"
description = "Physics-informed information field theory experiments with JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jax>=0.4.28",
  "jaxlib>=0.4.28",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.4.28"]
gpu-metal = ["jax-metal"]
modal = ["modal>=0.64"]
gui = ["PySide6>=6.7"]
inverse = ["numpyro>=0.15"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["run_types", "run_manager", "storage"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "pipelines*", "utils*", "models*", "backends*", "benchmarks*"]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
